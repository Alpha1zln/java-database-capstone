# ===================================================================
# SMART CLINIC MANAGEMENT SYSTEM (CMS) - APPLICATION CONFIGURATION
# ===================================================================

# -------------------------------------------------------------------
# 1. APPLICATION IDENTITY
# -------------------------------------------------------------------
# Sets the internal application name (appears in logs, metrics, and banners)
spring.application.name=back-end


# -------------------------------------------------------------------
# 2. MYSQL RELATIONAL DATABASE CONFIGURATION (JPA / HIBERNATE)
# -------------------------------------------------------------------
# JDBC connection URL to local MySQL:
# - localhost:3306 = local machine on standard MySQL port
# - /cms           = target database name
# - useSSL=false   = disables SSL encryption for local development
# - allowPublicKeyRetrieval=true = required for MySQL 8 modern authentication
# - serverTimezone=UTC = prevents timezone shift discrepancies with dates
spring.datasource.url=jdbc:mysql://localhost:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# MySQL master administrator username
spring.datasource.username=root

# MySQL password set during installation / reconfiguration
spring.datasource.password=1234


# -------------------------------------------------------------------
# 3. HIBERNATE ORM DDL & LOGGING SETTINGS
# -------------------------------------------------------------------
# Automatically creates/updates tables in MySQL based on Java @Entity classes
# (Options: 'update' keeps data safe; 'create' drops and recreates on each run)
spring.jpa.hibernate.ddl-auto=update

# Prints all generated SQL statements (SELECT, INSERT, CREATE TABLE) in the terminal
spring.jpa.show-sql=true

# Formats the printed SQL with clean indentations and line breaks for readability
spring.jpa.properties.hibernate.format_sql=true

# Disables Open Session In View (OSIV) to prevent database connection leaks
spring.jpa.open-in-view=false


# -------------------------------------------------------------------
# 4. MONGODB DOCUMENT DATABASE CONFIGURATION (NO-SQL)
# -------------------------------------------------------------------
# MongoDB connection URI:
# - root:db1234      = MongoDB credentials
# - localhost:27017  = default MongoDB host and port
# - /prescriptions   = database name holding prescription documents
# - authSource=admin = authentication database where root user is verified
spring.data.mongodb.uri=mongodb://root:db1234@localhost:27017/prescriptions?authSource=admin


# -------------------------------------------------------------------
# 5. ACTUATOR HEALTH MONITORING & API PATH
# -------------------------------------------------------------------
# Exposes full diagnostic details at /actuator/health (connectivity, disk space)
management.endpoint.health.show-details=always

# Enables live health-check pings to verify database availability
management.health.db.enabled=true

# Root URL prefix for all REST API endpoints
api.path=/


# -------------------------------------------------------------------
# 6. SECURITY & JWT (JSON WEB TOKEN) AUTHENTICATION
# -------------------------------------------------------------------
# Secret cryptographic key used by JJWT to digitally sign and verify login tokens
jwt.secret=$!@#$^%$$$%####$DDCPN0234FCFDPD8670M


# -------------------------------------------------------------------
# 7. STATIC ASSETS & FRONTEND SERVING
# -------------------------------------------------------------------
# Directory where static frontend files (HTML, CSS, JS, images) are served from
spring.web.resources.static-locations=classpath:/static/


# -------------------------------------------------------------------
# 8. THYMELEAF TEMPLATE ENGINE CONFIGURATION
# -------------------------------------------------------------------
# Folder containing server-rendered Thymeleaf HTML templates
spring.thymeleaf.prefix=classpath:/templates/

# Automatically appends '.html' when a controller returns a view name
spring.thymeleaf.suffix=.html

# Parser mode for modern HTML5 markup
spring.thymeleaf.mode=HTML

# Disables template caching during development (instant browser refresh on HTML changes)
spring.thymeleaf.cache=false

# Standard character encoding for all templates
spring.thymeleaf.encoding=UTF-8